syntax = "proto3";

package gamepb.milkteapb;

import "corepb.proto";

// 奶茶热销中（S4，活动根 2026110100）协议。
// 命令字、选择子与字段号来自公开参考项目（映射仅存本机 sources.json）的
// 官方 1.15.0.1 编码器重构：16 条主玩法请求 hex 向量已与本文件逐条字节级
// 核对（test/milk-tea-activity.test.js）。证据等级 = 编码器重构 + 当前官方
// List 下发交叉验证，仅支撑面板手动层（两级写操作策略第①级）。
// 独立命名空间：只声明本活动需要的最小请求/回复封装，物品复用 corepb.Item，
// 快乐值活动体复用 activitypb 既有定义（120），不重复声明。

// ---------- 读路径：根 GetGroup 回包内四个子节点身份的详情体 ----------

message MilkTeaActivityHead {
    int64 activity_id = 1;
    int64 type = 3;
    int64 begin_time = 6;
    int64 end_time = 7;
    int64 settle_start_time = 24;
}

message MilkTeaGoodsItem {
    int64 id = 1;
    int64 count = 2;
}

message MilkTeaCondHint {
    string cond_type = 1;
    string params = 2;
    bool satisfied = 3;
    int64 current = 4;
    int64 target = 5;
}

// 商城子节点 2026110102 的 102 体：相比通用 ExchangeShop 兜底解析，
// 这里有真实的 purchase_limit / purchased_count / 多条目 cost / cond_hints。
message MilkTeaGoodsInfo {
    int64 id = 1;
    repeated MilkTeaGoodsItem item = 2;
    repeated MilkTeaGoodsItem cost = 3;
    int64 purchase_limit = 4;
    int64 purchased_count = 5;
    int64 order = 6;
    string name = 7;
    string desc = 8;
    int64 diamond_cost_count = 9;
    repeated MilkTeaCondHint cond_hints = 13;
}

message MilkTeaShopBody {
    repeated MilkTeaGoodsInfo goods = 1;
}

message MilkTeaActivitySummary {
    int64 shop_open_at = 1;
    string shop_name = 2;
    int64 rename_cd_until_at = 3;
    int32 level = 4;
    int64 total_revenue = 5;
    bool hire_disabled = 6;
    bool cashier_full = 7;
    bool cashier_warning = 8;
    bool can_upgrade = 9;
    repeated corepb.Item opening_gift_preview = 10;
    bool has_worker_shift = 11;
    bool has_unclaimed_wage = 12;
    repeated int64 guide_ids = 15;
    int64 next_cup_at = 16;
}

message MilkTeaBody {
    MilkTeaActivitySummary summary = 1;
}

message MilkTeaGrowthFundCondition {
    string type = 1;
    int64 current_value = 2;
    int64 target_value = 3;
    bool reached = 4;
}

message MilkTeaGrowthFundTier {
    int32 tier_id = 1;
    repeated MilkTeaGrowthFundCondition conditions = 2;
    repeated corepb.Item reward = 3;
    int32 state = 4;
}

message MilkTeaGrowthFundBody {
    bool unlocked = 1;
    repeated corepb.Item unlock_cost = 2;
    repeated MilkTeaGrowthFundTier tiers = 3;
}

message MilkTeaActivityData {
    MilkTeaActivityHead head = 1;
    MilkTeaShopBody shop = 102;
    gamepb.activitypb.ActivityBodyShareReward share_reward = 120;
    MilkTeaBody milk_tea = 121;
    MilkTeaGrowthFundBody growth_fund = 122;
}

message MilkTeaActivityGroup {
    MilkTeaActivityHead head = 1;
    repeated MilkTeaActivityData children = 2;
}

message MilkTeaGetGroupReply {
    MilkTeaActivityGroup group = 1;
}

// ---------- 玩法视图（显式查询与操作回包） ----------

message MilkTeaPlayerInfo {
    int64 gid = 1;
    string name = 2;
    string avatar = 3;
    int64 level = 4;
    int32 gender = 5;
}

message MilkTeaSlotView {
    int32 slot_index = 1;
    bool is_robot = 2;
    int64 shift_id = 3;
    int64 begin_at = 4;
    int64 end_at = 5;
    int64 cost = 6;
    int32 talent_id = 7;
    string talent_name = 8;
    int32 interact_type = 9;
    int64 interact_at = 10;
    MilkTeaPlayerInfo employee = 11;
}

message MilkTeaShopView {
    int32 level = 1;
    int64 total_revenue = 2;
    int64 next_level_revenue = 3;
    int64 cashier_capacity_sec = 4;
    int64 cashier_elapsed_sec = 5;
    repeated MilkTeaSlotView slots = 9;
    map<int64, int64> drink_cups = 10;
    int64 projection_ver = 11;
    float sec_per_cup = 12;
    int64 next_full_at = 14;
    int64 sales_item_id = 15;
    int64 sales_duration_sec = 16;
    bool is_settling = 18;
    repeated corepb.Item pending_rewards = 19;
    map<int64, int64> pending_cups_by_recipe = 20;
    map<int64, int64> pending_cups_by_source = 21;
    int64 boost_cups_per_use = 22;
    repeated corepb.Item boost_preview_rewards = 23;
    int64 effective_cups_per_hour = 24;
    map<int64, int64> boost_coin_price = 25;
}

message MilkTeaRecipeView {
    int64 recipe_id = 1;
    string recipe_name = 2;
    bool unlocked = 3;
    bool is_advanced = 4;
    int64 token_price = 5;
    int64 coin_price = 6;
    int64 stock_cups = 7;
    int64 clear_coin_price = 8;
    int64 clear_coin_total = 9;
}

message MilkTeaHireFriend {
    MilkTeaPlayerInfo friend = 1;
    bool is_robot = 2;
    int32 talent_id = 3;
    string talent_name = 4;
    int32 state = 5;
    int64 state_until_at = 6;
    int64 rehire_available_at = 7;
}

message MilkTeaInteractPreview {
    int32 interaction_type = 1;
    int64 promote_cups = 2;
}

message MilkTeaInteractOwnerEffect {
    int64 price_bp = 1;
    int64 effect_cups = 2;
    int64 promote_cups = 3;
    int32 talent_reduce_bp = 4;
}

message MilkTeaInteractFriendEffect {
    int32 bonus_bp = 1;
    int32 penalty_bp = 2;
    int64 bonus_amount = 3;
    int64 taste_recipe_id = 4;
    int64 taste_cups = 5;
}

message MilkTeaHireInteract {
    int32 type = 1;
    bool success = 2;
    int64 interaction_id = 3;
    int64 at = 4;
    int64 rand = 5;
    MilkTeaInteractOwnerEffect owner = 6;
    MilkTeaInteractFriendEffect friend = 7;
}

message MilkTeaMyShift {
    MilkTeaPlayerInfo employer = 1;
    string shop_name = 2;
    int64 shift_id = 3;
    int32 talent_id = 4;
    string talent_name = 5;
    int64 begin_at = 6;
    int64 end_at = 7;
    int64 settle_start_at = 8;
    int32 interact_count = 9;
    int32 interact_limit = 10;
    int64 wage_total = 11;
    MilkTeaHireInteract interact = 12;
    repeated MilkTeaInteractPreview interact_previews = 13;
}

message MilkTeaWageParts {
    int64 base_wage = 1;
    int64 final_wage = 2;
}

message MilkTeaWageSlip {
    MilkTeaPlayerInfo employer = 1;
    string shop_name = 2;
    int64 shift_id = 3;
    int64 begin_at = 4;
    int64 end_at = 5;
    int64 work_sec = 6;
    MilkTeaWageParts wages = 7;
    bool truncated = 8;
    int32 wage_status = 9;
    MilkTeaHireInteract interact = 10;
}

message MilkTeaRankItem {
    MilkTeaPlayerInfo owner = 1;
    string shop_name = 2;
    int32 level = 3;
    int64 total_revenue = 4;
    int32 rank = 5;
    bool can_show_off = 6;
}

message MilkTeaHireRecord {
    MilkTeaPlayerInfo friend = 1;
    int64 hire_at = 2;
    int64 duration_sec = 3;
    int64 work_sec = 4;
    bool settled = 5;
    int64 shift_id = 6;
    MilkTeaHireInteract interact = 7;
    int32 talent_id = 8;
    string talent_name = 9;
    MilkTeaWageParts wages = 10;
}

// ---------- 操作请求 / 回复 ----------

message MilkTeaShopBuyReq {
    int64 goods_id = 1;
    int64 count = 2;
}

message MilkTeaShareFirstReq {}
// ark field 1 contains private sharing credentials and is deliberately ignored.
message MilkTeaShareFirstRsp { int64 granted_score = 2; }
message MilkTeaShareMilestonesReq {
}

message MilkTeaShareDailyReq {
}

message MilkTeaCreateShopReq {
    string shop_name = 1;
}

message MilkTeaRenameShopReq {
    string shop_name = 1;
}

message MilkTeaGetShopReq {
}

message MilkTeaGetHireListReq {
    int32 duration_id = 1;
}

message MilkTeaHireItem {
    int32 slot_index = 1;
    int32 duration_id = 2;
    int64 target_gid = 3;
}

message MilkTeaHireReq {
    repeated MilkTeaHireItem hires = 1;
}

message MilkTeaGetWorkshopReq {
}

message MilkTeaClaimCashierReq {
}

message MilkTeaBoostReq {
    int32 count = 1;
}

message MilkTeaUpgradeReq {
}

message MilkTeaCraftReq {
    repeated int64 fruit_uids = 1;
}

message MilkTeaGetWorkPageReq {
}

message MilkTeaClaimWagesReq {
}

message MilkTeaInteractReq {
    int64 target_gid = 1;
    int32 interaction_type = 2;
}

message MilkTeaGetRankReq {
    int32 page = 1;
}

message MilkTeaGetSalesLogReq {
    int64 day = 1;
}

message MilkTeaSetHireDisableReq {
    bool hire_disabled = 1;
}

message MilkTeaOperateRequest {
    int64 activity_id = 1;
    int64 operate_type = 2;
    MilkTeaShopBuyReq shop_buy = 101;
    MilkTeaShareFirstReq share_reward_share = 153;
    MilkTeaShareMilestonesReq share_reward_claim_milestones = 154;
    MilkTeaShareDailyReq share_reward_claim_daily = 157;
    MilkTeaCreateShopReq milk_tea_create_shop = 158;
    MilkTeaRenameShopReq milk_tea_rename_shop = 159;
    MilkTeaGetShopReq milk_tea_get_shop = 160;
    MilkTeaGetHireListReq milk_tea_get_hire_list = 161;
    MilkTeaHireReq milk_tea_hire = 162;
    MilkTeaGetWorkshopReq milk_tea_get_workshop = 163;
    MilkTeaClaimCashierReq milk_tea_claim_cashier = 164;
    MilkTeaBoostReq milk_tea_boost = 165;
    MilkTeaUpgradeReq milk_tea_upgrade = 166;
    MilkTeaCraftReq milk_tea_craft = 167;
    MilkTeaGetWorkPageReq milk_tea_get_work_page = 168;
    MilkTeaClaimWagesReq milk_tea_claim_wages = 169;
    MilkTeaInteractReq milk_tea_interact = 170;
    MilkTeaGetRankReq milk_tea_get_rank = 171;
    MilkTeaGetSalesLogReq milk_tea_get_sales_log = 172;
    MilkTeaSetHireDisableReq milk_tea_set_hire_disable = 173;
}

message MilkTeaShopBuyRsp {
    repeated corepb.Item awards = 1;
    repeated corepb.Item costs = 2;
}

message MilkTeaCreateShopRsp {
    repeated corepb.Item opening_gift = 2;
}

message MilkTeaRenameShopRsp {
}

message MilkTeaGetShopRsp {
    MilkTeaShopView shop = 1;
}

message MilkTeaGetHireListRsp {
    int32 duration_id = 1;
    int64 wage_total = 2;
    int64 min_remain_biz_sec = 3;
    repeated MilkTeaHireFriend friends = 4;
    repeated MilkTeaHireFriend robots = 5;
}

message MilkTeaHireResult {
    int32 slot_index = 1;
    int32 duration_id = 2;
    int64 target_gid = 3;
    bool success = 4;
    MilkTeaSlotView slot = 5;
    int64 truncated_work_sec = 6;
    int64 refund_token = 7;
    int32 error_code = 8;
    string error_msg = 9;
}

message MilkTeaHireRsp {
    repeated MilkTeaHireResult results = 1;
}

message MilkTeaGetWorkshopRsp {
    repeated MilkTeaRecipeView recipes = 1;
}

message MilkTeaClaimCashierRsp {
    repeated corepb.Item items = 1;
}

message MilkTeaBoostRsp {
    int32 cups = 1;
    int64 token_gain = 2;
    int64 coin_gain = 3;
}

message MilkTeaUpgradeRsp {
    int32 level = 1;
    repeated corepb.Item rewards = 2;
}

message MilkTeaCraftRsp {
    map<int64, int64> crafted_cups = 1;
    map<int64, int64> drink_cups = 2;
    repeated corepb.Item used_fruits = 3;
}

message MilkTeaGetWorkPageRsp {
    MilkTeaMyShift my_shift = 1;
    repeated MilkTeaWageSlip slips = 2;
    int32 talent_id = 3;
    string talent_name = 4;
    bool interact_done = 5;
}

message MilkTeaClaimWagesRsp {
    repeated corepb.Item items = 1;
    int32 claimed_count = 2;
}

message MilkTeaInteractRsp {
    int32 interaction_type = 1;
    bool success = 2;
    repeated corepb.Item items_gained = 3;
    int64 interaction_id = 4;
    bool wage_adjusted = 5;
    int64 next_effect_cup_ts = 6;
    MilkTeaInteractOwnerEffect owner = 7;
    MilkTeaInteractFriendEffect friend = 8;
}

message MilkTeaGetRankRsp {
    repeated MilkTeaRankItem ranks = 1;
    int32 my_rank = 2;
    int64 snapshot_time = 3;
    int32 page = 4;
    bool has_more = 5;
}

message MilkTeaGetSalesLogRsp {
    int64 day = 1;
    int64 token = 2;
    int64 coin = 3;
    int64 cups = 4;
    map<int64, int64> cups_by_recipe = 5;
    map<int64, int64> cups_by_source = 6;
    repeated MilkTeaHireRecord hires = 7;
    repeated corepb.Item items = 8;
}

message MilkTeaSetHireDisableRsp {
    bool hire_disabled = 1;
}

message MilkTeaClaimGrowthFundRsp {
    repeated int32 claimed_tier_ids = 1;
    repeated corepb.Item awards = 2;
}

message MilkTeaOperateReply {
    int64 activity_id = 1;
    int64 operate_type = 2;
    MilkTeaActivityData data = 3;
    MilkTeaShopBuyRsp shop_buy = 101;
    MilkTeaShareFirstRsp share_reward_share = 153;
    gamepb.activitypb.ShareRewardClaimMilestonesRsp share_reward_claim_milestones = 154;
    gamepb.activitypb.ShareRewardClaimDailyRsp share_reward_claim_daily = 157;
    MilkTeaCreateShopRsp milk_tea_create_shop = 158;
    MilkTeaRenameShopRsp milk_tea_rename_shop = 159;
    MilkTeaGetShopRsp milk_tea_get_shop = 160;
    MilkTeaGetHireListRsp milk_tea_get_hire_list = 161;
    MilkTeaHireRsp milk_tea_hire = 162;
    MilkTeaGetWorkshopRsp milk_tea_get_workshop = 163;
    MilkTeaClaimCashierRsp milk_tea_claim_cashier = 164;
    MilkTeaBoostRsp milk_tea_boost = 165;
    MilkTeaUpgradeRsp milk_tea_upgrade = 166;
    MilkTeaCraftRsp milk_tea_craft = 167;
    MilkTeaGetWorkPageRsp milk_tea_get_work_page = 168;
    MilkTeaClaimWagesRsp milk_tea_claim_wages = 169;
    MilkTeaInteractRsp milk_tea_interact = 170;
    MilkTeaGetRankRsp milk_tea_get_rank = 171;
    MilkTeaGetSalesLogRsp milk_tea_get_sales_log = 172;
    MilkTeaSetHireDisableRsp milk_tea_set_hire_disable = 173;
    MilkTeaClaimGrowthFundRsp growth_fund_claim = 176;
}
